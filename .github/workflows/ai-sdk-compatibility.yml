name: AI SDK Compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  contracts:
    name: AI SDK ${{ matrix.ai-sdk }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ai-sdk: ["7.0.0", "7"]
        node: [22, 24]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ai-sdk-${{ matrix.ai-sdk }}-${{ matrix.node }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build core and its dependencies
        run: pnpm exec lerna run build --scope @voltagent/core --include-dependencies
      - name: Check native runtime contracts and consumer types
        run: pnpm test:ai-sdk ${{ matrix.ai-sdk }}
